<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="preconnect" href="https://a.tile.openstreetmap.org"> <!--Estos para mejorar SEO-->
    <link rel="preconnect" href="https://b.tile.openstreetmap.org">
    <link rel="preconnect" href="https://c.tile.openstreetmap.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Attack Map | Live Monitor</title>
    <meta name="description" content="Monitor de ciberataques en tiempo real desarrollado por Matías Cortinez. Visualización global de amenazas usando Node.js y Leaflet.">
    <meta name="keywords" content="cybersecurity, attack map, real-time monitor, nodejs, matías cortinez">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://unpkg.com; object-src 'none';"> <!--Para reparar error de seguridad al auditar SEO-->
</head>
<body>

    <div class="ui-overlay">
        <h1>GLOBAL THREAT MONITOR</h1>
        <div id="stats">
            Ataques detectados: <span id="count">0</span>
        </div>
        
        <div class="panel-section">
            <div class="label">ULTIMA AMENAZA:</div>
            <div id="last-attack">Esperando datos...</div>
        </div>

        <div class="panel-section">
            <div class="label">HISTORIAL RECIENTE:</div>
            <div id="attack-log"></div> </div>
    </div>

    <div id="map"></div>

    <a href="how-it-works.html" class="terminal-floating-btn right-pos" title="Ver Arquitectura" aria-label="Ver Arquitectura del sistema">
        <span class="console-icon">?</span>
    </a>

    <a href="commands.html" class="terminal-floating-btn left-pos" title="Ver comandos de instalación" aria-label="Ver Comandos usados para crear n8n en servidos local">
        <span class="console-icon">>_</span>
    </a>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script> <!--defer = para arreglar el SEO-->
    <script src="app.js" defer></script>
</body>
</html>
