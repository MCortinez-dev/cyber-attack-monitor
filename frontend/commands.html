<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terminal - Proceso de Despliegue</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="commands.css">
</head>
<body>

    <a href="index.html" class="back-btn">← VOLVER AL MAPA</a>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span>bash — mcortinez@servidor-Alfa</span>
        </div>
        <div id="terminal-body"></div>
        
        <div id="final-links">
            <p>¡Despliegue finalizado con éxito! Gracias por revisar mi arquitectura.</p>
            <a href="https://github.com/MCortinez-dev" target="_blank" class="social-link">[ GITHUB ]</a>
            <a href="https://www.linkedin.com/in/matias-roberto-cortinez-454143241/" target="_blank" class="social-link">[ LINKEDIN ]</a>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal-body');
        const finalLinks = document.getElementById('final-links');

        const script = [
            { type: 'cmd', text: 'sudo apt update && sudo apt install docker.io docker-compose -y' },
            { type: 'out', text: 'Instalando dependencias de infraestructura... Done.' },
            { type: 'cmd', text: 'mkdir cyber-map && cd cyber-map' },
            { type: 'cmd', text: 'mkdir n8n_data && chmod 777 n8n_data' },
            { type: 'out', text: 'Preparando volúmenes persistentes para base de datos SQLite...' },
            { type: 'cmd', text: 'cat <<EOF > docker-compose.yml\nversion: "3"\nservices:\n  n8n:\n    image: n8nio/n8n\n    volumes: ["./n8n_data:/home/node/.n8n"]\n  api:\n    build: ./attack-api\nEOF' },
            { type: 'cmd', text: 'docker-compose up -d' },
            { type: 'out', text: 'Creating network "cyber-map_default"...\nCreating cyber-map-n8n-1 ... done\nCreating cyber-map-api-1 ... done' },
            { type: 'cmd', text: 'ls -R' },
            { type: 'out', text: '.:\nattack-api  backend  docker-compose.yml  n8n_data\n\n./attack-api:\nDockerfile  package.json  server.js' },
            { type: 'cmd', text: 'docker ps' },
            { type: 'out', text: 'CONTAINER ID   IMAGE       STATUS          PORTS\n85ced85b530a   n8nio/n8n   Up 1 hour       0.0.0.0:5678->5678/tcp\n5f4d1f6de35b   cyber-api   Up 34 hours     0.0.0.0:3000->3000/tcp' },
            { type: 'cmd', text: 'echo "Servidor Alfa operativo. Sincronizando con Railway..."' }
        ];

        let i = 0;

        async function typeText(text, element, speed = 40) {
            for (let char of text) {
                element.innerHTML += char;
                await new Promise(r => setTimeout(r, speed));
            }
            element.innerHTML += '<br>';
        }

        async function runTerminal() {
            for (let step of script) {
                const line = document.createElement('div');
                terminal.appendChild(line);

                if (step.type === 'cmd') {
                    line.innerHTML = `<span class="user">mcortinez@servidor-Alfa</span>:<span class="path">~/cyber-map</span>$ `;
                    await typeText(step.text, line, 50);
                } else {
                    line.className = 'output';
                    await typeText(step.text, line, 10);
                }
                terminal.scrollTop = terminal.scrollHeight;
                await new Promise(r => setTimeout(r, 800));
            }
            finalLinks.style.display = 'block';
        }

        runTerminal();
    </script>
</body>
</html>
