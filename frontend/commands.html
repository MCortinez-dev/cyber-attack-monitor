<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comandos Self-Hosting 🤖</title>
    <meta name="description" content="Monitor de ciberataques en tiempo real desarrollado por Matías Cortinez. Visualización global de amenazas usando Node.js y Leaflet.">
    <meta name="keywords" content="cybersecurity, attack map, real-time monitor, nodejs, matías cortinez">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="commands.css">
</head>
<body>

    <div class="terminal-window">
        <div class="terminal-header">
            <div class="dots">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <span>bash — mcortinez@servidor-Alfa</span>
        </div>
        <div id="terminal-body"></div>
        
        <div id="final-links">
            <p>¡Cree su usuario en el explorador y empiece a armar su Workflow! Gracias por visitar mi página.</p>
            <a href="https://github.com/MCortinez-dev" target="_blank" class="social-link">[ GITHUB ]</a>
            <a href="https://www.linkedin.com/in/matias-roberto-cortinez-454143241/" target="_blank" class="social-link">[ LINKEDIN ]</a>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal-body');
        const finalLinks = document.getElementById('final-links');

        const script = [
            { type: 'cmd', text: 'sudo apt update && sudo apt install docker.io docker-compose -y' },
            { type: 'out', text: 'Leyendo lista de paquetes... Hecho. Instalando Docker Engine...' },
            
            { type: 'cmd', text: 'mkdir ~/cyber-map && cd ~/cyber-map' },
            { type: 'out', text: 'Entorno de trabajo preparado en /home/servidor/cyber-map' },

            { type: 'cmd', text: 'mkdir n8n_data && chmod 777 n8n_data' },
            { type: 'out', text: 'Creando volumen de persistencia para SQLite y nodos personalizados...' },

            { type: 'cmd', text: 'docker run -d --name cyber-map-n8n-1 -p 5678:5678 -v $(pwd)/n8n_data:/home/node/.n8n n8nio/n8n' },
            { type: 'out', text: 'Unable to find image n8nio/n8n:latest locally\nlatest: Pulling from n8nio/n8n\nDigest: sha256:e3b0c... \nStatus: Downloaded newer image. Container 85ced85b530a started.' },

            { type: 'cmd', text: 'docker ps' },
            { type: 'out', text: 'CONTAINER ID   IMAGE       STATUS          PORTS\n85ced85b530a   n8nio/n8n   Up 1 minute     0.0.0.0:5678->5678/tcp' },

            { type: 'cmd', text: 'echo "n8n listo. Accediendo a http://localhost:5678 para configurar el webhook a Railway..."' }
        ];

        let i = 0;

        async function typeText(text, element, speed = 40) {
            for (let char of text) {
                element.innerHTML += char;
                await new Promise(r => setTimeout(r, speed));
            }
            element.innerHTML += '<br>';
        }

        async function runTerminal() {
            for (let step of script) {
                const line = document.createElement('div');
                terminal.appendChild(line);

                if (step.type === 'cmd') {
                    line.innerHTML = `<span class="user">mcortinez@servidor-Alfa</span>:<span class="path">~/cyber-map</span>$ `;
                    await typeText(step.text, line, 50);
                } else {
                    line.className = 'output';
                    await typeText(step.text, line, 10);
                }
                terminal.scrollTop = terminal.scrollHeight;
                await new Promise(r => setTimeout(r, 800));
            }
            finalLinks.style.display = 'block';
        }

        runTerminal();
    </script>

    <a href="index.html" class="back-btn">LIVE-MAP 🗺</a>
    
</body>
</html>
